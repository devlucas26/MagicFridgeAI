spring.application.name=MagicFridgeAI

# Configuracao do H2 Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o Console do H2 (acessivel em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra as queries SQL no console
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# configuracao do flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# api gpt
chatgpt.api.url=https://api.openai.com/v1/chat/completions
api.key=${API_KEY_OPENAI}

server.tomcat.basedir=./target/tomcat