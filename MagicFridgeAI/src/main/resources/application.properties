spring.application.name=MagicFridgeAI

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:file:./data/magicfridgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o Console do H2 (acessível em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mostra as queries SQL no console (Útil para debug)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

#configura��o do flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#api gpt
API_KEY_OPENAI=${API_KEY_OPENAI}

